# __VLLM_ROLE_ARN__ is filled in at apply time by `make vllm-up` from the Terraform
# output. It is not committed: the IRSA role is recreated with every cluster, and an
# ARN in git is both an account-number leak and a value that goes stale silently.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: inference
  annotations:
    eks.amazonaws.com/role-arn: __VLLM_ROLE_ARN__
