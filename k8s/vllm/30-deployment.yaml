apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: inference
  labels:
    app: vllm-server
spec:
  replicas: 1

  # There is exactly one GPU in the cluster. A rolling update would ask the scheduler to
  # place a second pod while the first still holds nvidia.com/gpu, so it would hang on
  # Pending forever. Recreate tears the old pod down first.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: vllm-server

  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      serviceAccountName: vllm

      # The taint keeps everything else off this node; the nodeSelector keeps vLLM off
      # every other node. Both halves are needed -- the taint alone would still let vLLM
      # schedule onto the tooling node and quietly measure a CPU-only run.
      nodeSelector:
        workload: inference
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule

      volumes:
        - name: weights
          # Instance-store NVMe, not an EBS PVC. g6.xlarge and g6e.xlarge each ship 250 GB
          # of local NVMe at no extra cost, and the node group sets nodeadm's
          # localStorage.strategy=RAID0 so that an emptyDir lands on it.
          #
          # Three things this buys over a PVC: no EBS bill, far higher read throughput
          # when vLLM loads the weights, and no zonal pinning -- an EBS volume would tie
          # the GPU node to one AZ, which is a real risk when G-family capacity is scarce.
          #
          # The cost is that the weights are re-synced whenever the NODE is replaced
          # rather than whenever the cluster is. Within a session, pod restarts keep the
          # cache: the marker file below survives because emptyDir outlives the container,
          # not the pod. A rollout DOES lose it, so week 4's engine-parameter sweep pays
          # the S3 sync on every step -- budget 1-3 minutes each.
          emptyDir:
            sizeLimit: 40Gi
        - name: shm
          # vLLM's workers coordinate over shared memory. The 64 MiB container default is
          # far too small and fails as a hang during model load, not as an error message.
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi

      initContainers:
        - name: fetch-weights
          image: amazon/aws-cli:2.36.47
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -f /weights/.sync-complete ]; then
                echo "weights already cached on the volume, skipping sync"
                exit 0
              fi
              echo "syncing ${S3_MODEL_URI} -> /weights"
              aws s3 sync "${S3_MODEL_URI}" /weights/ --only-show-errors
              # Fail loudly on a partial sync rather than letting vLLM start and die
              # somewhere less obvious.
              test -f /weights/config.json
              ls /weights/*.safetensors >/dev/null
              touch /weights/.sync-complete
              echo "sync complete: $(du -sh /weights | cut -f1)"
              # Fail loudly if the emptyDir landed on the root EBS volume instead of the
              # NVMe: the symptom otherwise is just "the sync got slower", which nobody
              # investigates.
              df -h /weights | tail -1
          env:
            - name: S3_MODEL_URI
              value: "s3://__ARTIFACTS_BUCKET__/models/Qwen2.5-7B-Instruct/"
          volumeMounts:
            - name: weights
              mountPath: /weights
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              memory: 1Gi

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          args:
            - --model=/weights
            # The API name stays stable even if the weights path or checkpoint changes,
            # so benchmark configs never have to be rewritten.
            - --served-model-name=qwen2.5-7b
            - --dtype=float16
            # Conservative starting point. Week 4 sweeps these; week 1 only needs the
            # engine to come up and answer.
            - --max-model-len=8192
            - --gpu-memory-utilization=0.85
            - --max-num-seqs=128
            - --port=8000
            # Per-request logging becomes the bottleneck at high offered load and would
            # show up as engine latency.
            - --disable-log-requests
          ports:
            - name: http
              containerPort: 8000
          env:
            # Weights come from S3 and nowhere else. If the sync missed a file we want a
            # hard failure here rather than a silent download that makes one run's model
            # subtly different from the next one's.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          volumeMounts:
            - name: weights
              mountPath: /weights
              # The engine under test must not be able to mutate the weights that define
              # the experiment.
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "3"
              memory: 12Gi
              nvidia.com/gpu: 1
            limits:
              # Deliberately no CPU limit. This node is tainted and runs nothing else, so
              # a limit isolates nothing -- it only risks CFS throttling, which inflates
              # exactly the TTFT numbers this project exists to measure.
              memory: 12Gi
              nvidia.com/gpu: 1
          startupProbe:
            # Up to 20 minutes: a cold volume syncs 14.2 GiB from S3 and then loads it
            # onto the GPU. Too tight a threshold turns a slow start into a crash loop.
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
