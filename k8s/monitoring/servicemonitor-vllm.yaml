# Only vLLM needs a hand-written ServiceMonitor. DCGM's is generated by the GPU
# Operator chart (see gpu-operator-values.yaml) because its Service is created at
# runtime and its port name cannot be read from this repo.
#
# Three things must line up or the target never appears, with no error anywhere:
#   1. selector.matchLabels matches the SERVICE's labels, not the pod's
#   2. namespaceSelector names the namespace the Service lives in
#   3. endpoints[].port is the port NAME from the Service, never the number
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["inference"]
  selector:
    matchLabels:
      app: vllm-server
  endpoints:
    # 5s, not the 15s default: a capacity run lasts five minutes and the queue depth
    # that explains a latency spike can build and drain inside one 15s window.
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
