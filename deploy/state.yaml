# Trang thai trien khai. CHI rollout.yml sua file nay, qua pull request.
# Kiem bang: python3 bench/scripts/rollout_state.py validate
#
# paused: true dung MOI rollout o buoc ke tiep. Bat truoc khi do tai -- mot lan
# rollout chen vao giua phep do lam cum chi con 3/4 dung luong va so TC1a sai.
paused: false

# Hai track, moi track mot card. Day la cach nen tang chung minh "da mo hinh": hai
# mo hinh khac co, phuc vu dong thoi, moi cai co vong doi rollout rieng -- chu khong
# phai mot bo trong so duoi hai ten.
#
# Track 7B lay 2 card, track 1.5B lay 1 -- tong 3 node GPU, ~3,4 USD/gio.
#
# 7B phai la 2, khong phai 1: `helm_values` tinh stable = card_count - 1, nen mot track
# mot card se cho stable 0 pod ngay khi co ung vien, trong khi bang route canary van gui
# 75% traffic that vao Service cua stable. rollout_state.py tu choi trang thai do.
#
# 1.5B giu 1 card va khai auto_rollout: false trong catalog: quota 16 vCPU khong du cho
# hai rollout cung luc, nen cho no 2 card chi de "co the rollout" la tra tien cho mot thu
# khong dung den.
#
# Do TC1a thi doi cards cua 7B len 4 va tat track 1.5B.
qwen2.5-7b:
  stable:
    weights: models/Qwen2.5-7B-Instruct-AWQ
    engine: vllm/vllm-openai:v0.29.0
    # Checkpoint dua len S3 bang tay truoc khi co hop dong model, nen khong co manifest
    # de doi chieu. Ngoai le co thoi han: xuat ban lai theo hop dong roi xoa hai dong nay.
    verify: false
    reason: "checkpoint dua len tay truoc khi co hop dong model; chua co manifest"
  cards: 2
  phase: idle

qwen2.5-1.5b:
  stable:
    weights: models/Qwen2.5-1.5B-Instruct-AWQ
    engine: vllm/vllm-openai:v0.29.0
    verify: false
    reason: "checkpoint dua len tay truoc khi co hop dong model; chua co manifest"
  cards: 1
  phase: idle
