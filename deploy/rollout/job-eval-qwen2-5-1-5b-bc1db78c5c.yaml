# SINH RA TU deploy/state.yaml -- dung sua tay.
# Sinh lai: python3 bench/scripts/rollout_state.py render
# PR check sinh lai va so sanh, nen mot ban sua tay se bi bat o day chu khong phai
# o cum luc 3 gio sang.
apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-eval-qwen2-5-1-5b-bc1db78c5c
  namespace: benchmark
  labels: &id001
    app.kubernetes.io/part-of: rollout
    rollout/kind: eval
    rollout/id: qwen2-5-1-5b-bc1db78c5c
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: bench-runner
      restartPolicy: Never
      nodeSelector:
        workload: tooling
      containers:
      - name: eval
        image: amazon/aws-cli:2.36.47
        command:
        - python3
        - /assets/rollout_jobs.py
        args:
        - eval
        - --id
        - qwen2-5-1-5b-bc1db78c5c
        - --track
        - qwen2.5-1.5b
        - --report
        - s3://$(S3_BUCKET)/runs/rollout/qwen2-5-1-5b-bc1db78c5c/eval.json
        env:
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: cluster-config
              key: artifactsBucket
        - name: HOME
          value: /tmp
        - name: ROLLOUT_ASSETS
          value: /assets
        - name: PYTHONUNBUFFERED
          value: '1'
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: assets
          mountPath: /assets
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: assets
        configMap:
          name: rollout-assets
