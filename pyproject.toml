[project]
name = "vllm-bench"
version = "0.1.0"
description = "Capacity benchmarking and observability for a vLLM inference service on EKS"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
