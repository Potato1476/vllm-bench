# Recording rules turn the raw histograms into the handful of series the dashboards and
# alerts actually read. Computing a p99 from buckets on every dashboard refresh is both
# slow and easy to get subtly different in two places.
#
# EVERY vLLM RULE AGGREGATES BY model_name/model_class. With two models on one card,
# `sum by (le)` alone would merge a 7B class-A histogram with a 1.5B class-B one and
# produce a p99 that describes neither. Gateway and guardrail rules preserve their
# equivalent requested_model/model labels for the same reason.
#
# METRIC NAMES ARE NOT GUARANTEED. vLLM renames series between versions, and these were
# written against the names in the runbook, not against a live v0.29.0 engine. Run
# `make audit-metrics` once the engine is up and fix anything reported MISSING before
# trusting a single number that comes out of here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-recording
  namespace: monitoring
spec:
  groups:
    - name: vllm.latency
      interval: 15s
      rules:
        - record: vllm:ttft_seconds:p99
          expr: |
            histogram_quantile(0.99,
              sum by (le, model_name, model_class) (rate(vllm:time_to_first_token_seconds_bucket[2m])))

        - record: vllm:ttft_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, model_name, model_class) (rate(vllm:time_to_first_token_seconds_bucket[2m])))

        - record: vllm:tpot_seconds:p99
          expr: |
            histogram_quantile(0.99,
              sum by (le, model_name, model_class) (rate(vllm:inter_token_latency_seconds_bucket[2m])))

        # The SLO table states both classes in terms of end-to-end latency (A < 3s,
        # B < 1.5s), so it has to be recorded or those two numbers cannot be checked
        # against anything.
        - record: vllm:e2e_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, model_name, model_class) (rate(vllm:e2e_request_latency_seconds_bucket[2m])))

        - record: vllm:output_tokens:rate1m
          expr: sum by (model_name, model_class) (rate(vllm:generation_tokens_total[1m]))

        # vLLM v0.29 has no failure counter, so caller-facing error ratio is recorded
        # from LiteLLM in the gateway group below. A request rejected before the engine
        # must still count as a failure.
        - record: vllm:request_rate:rate1m
          expr: sum by (model_name, model_class) (rate(vllm:request_success_total[1m]))

    # Gateway-level SLI includes authentication, policy and upstream failures that the
    # engine cannot see. Keep requested_model so one bad route does not poison the other.
    - name: litellm.gateway
      interval: 15s
      rules:
        - record: litellm:request_rate:rate1m
          expr: |
            sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total[1m]))

        - record: litellm:error_ratio:rate2m
          expr: |
            sum by (requested_model) (rate(litellm_proxy_failed_requests_metric_total[2m]))
            /
            clamp_min(
              sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total[2m])),
              0.001
            )

        - record: litellm:e2e_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, requested_model) (rate(litellm_request_total_latency_metric_bucket[2m])))

        - record: litellm:e2e_seconds:p50
          expr: |
            histogram_quantile(0.50,
              sum by (le, requested_model) (rate(litellm_request_total_latency_metric_bucket[2m])))

        - record: litellm:e2e_seconds:p99
          expr: |
            histogram_quantile(0.99,
              sum by (le, requested_model) (rate(litellm_request_total_latency_metric_bucket[2m])))

        - record: litellm:llm_api_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, requested_model) (rate(litellm_llm_api_latency_metric_bucket[2m])))

        - record: litellm:ttft_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, requested_model) (rate(litellm_llm_api_time_to_first_token_metric_bucket[2m])))

        - record: litellm:queue_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, requested_model) (rate(litellm_request_queue_time_seconds_bucket[2m])))

        - record: litellm:overhead_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, model_group) (rate(litellm_overhead_latency_metric_bucket[2m])))

        - record: litellm:deployment_error_ratio:rate2m
          expr: |
            sum by (requested_model) (rate(litellm_deployment_failure_responses_total[2m]))
            /
            clamp_min(
              sum by (requested_model) (rate(litellm_deployment_total_requests_total[2m])),
              0.001
            )

        - record: litellm:deployment_seconds_per_output_token:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, litellm_model_name)
                (rate(litellm_deployment_latency_per_output_token_bucket[2m])))

        - record: litellm:input_tokens:rate1m
          expr: sum by (requested_model) (rate(litellm_input_tokens_metric_total[1m]))

        - record: litellm:output_tokens:rate1m
          expr: sum by (requested_model) (rate(litellm_output_tokens_metric_total[1m]))

        - record: litellm:postgres_error_ratio:rate5m
          expr: |
            sum(rate(litellm_postgres_failed_requests_total[5m]))
            /
            clamp_min(sum(rate(litellm_postgres_total_requests_total[5m])), 0.001)

        - record: litellm:postgres_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(litellm_postgres_latency_bucket[5m])))

        # --- Theo AGENT -------------------------------------------------------
        #
        # The brief asks for a dashboard split by agent across >=7 MOC copilots, and this
        # is the only place that dimension exists: vLLM sees one stream of requests and
        # cannot tell callers apart, so every per-agent number has to come from the
        # gateway.
        #
        # MEASURED ON A RUNNING PROXY, and the first assumption here was wrong.
        #
        # The plan was to key on end_user, populated from the OpenAI `user` field in the
        # request body, so per-agent numbers would work without the Aurora tier. Sending
        # {"user": "moc-analytics"} through LiteLLM v1.90.2 produces:
        #
        #     end_user="None"   user="default_user_id"   api_key_alias="None"
        #
        # The label exists; LiteLLM does not fill it from the request body. It is
        # populated from end-user tracking attached to a VIRTUAL KEY, and virtual keys
        # live in the database. So per-agent attribution needs `make data-up` and one key
        # per agent -- there is no database-free shortcut.
        #
        # The rules are kept as written because the shape is right and they start
        # reporting the moment keys exist. Until then they return ONE merged series, which
        # is the failure `make audit-metrics` now checks for: a dashboard drawing a single
        # plausible line where there should be seven.
        - record: agent:request_rate:rate1m
          expr: |
            sum by (end_user, requested_model) (
              rate(litellm_proxy_total_requests_metric_total[1m]))

        - record: agent:error_ratio:rate5m
          expr: |
            sum by (end_user) (rate(litellm_proxy_failed_requests_metric_total[5m]))
            /
            clamp_min(
              sum by (end_user) (rate(litellm_proxy_total_requests_metric_total[5m])),
              0.001)

        - record: agent:e2e_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, end_user) (rate(litellm_request_total_latency_metric_bucket[2m])))

        - record: agent:output_tokens:rate5m
          expr: |
            sum by (end_user) (rate(litellm_output_tokens_metric_total[5m]))

    - name: guardrail.service
      interval: 15s
      rules:
        - record: guardrail:request_rate:rate1m
          expr: sum by (model, outcome) (rate(guardrail_requests_total[1m]))

        - record: guardrail:block_ratio:rate5m
          expr: |
            sum by (model) (rate(guardrail_requests_total{outcome="refused"}[5m]))
            /
            clamp_min(sum by (model) (rate(guardrail_requests_total[5m])), 0.001)

        - record: guardrail:error_ratio:rate5m
          expr: |
            sum by (model) (rate(guardrail_requests_total{outcome="error"}[5m]))
            /
            clamp_min(sum by (model) (rate(guardrail_requests_total[5m])), 0.001)

        - record: guardrail:e2e_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, model) (rate(guardrail_request_duration_seconds_bucket[5m])))

        - record: guardrail:processing_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, model) (rate(guardrail_processing_duration_seconds_bucket[5m])))

        - record: guardrail:upstream_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, model) (rate(guardrail_upstream_duration_seconds_bucket[5m])))

        - record: guardrail:stage_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, stage) (rate(guardrail_stage_duration_seconds_bucket[5m])))

        - record: guardrail:upstream_error_ratio:rate5m
          expr: |
            sum by (model) (rate(guardrail_upstream_requests_total{outcome="error"}[5m]))
            /
            clamp_min(sum by (model) (rate(guardrail_upstream_requests_total[5m])), 0.001)

    # --- Chi phi -------------------------------------------------------------------
    #
    # The acceptance criterion is "cost per 1k tokens at least 30% below an external API",
    # and nothing in the stack measured it. The inputs are a throughput series that
    # already exists and an hourly price that does not change during a session, so this
    # is arithmetic rather than new infrastructure.
    #
    # THE HOURLY RATE IS A LITERAL AND HAS TO BE EDITED BY HAND when the instance mix
    # changes. Deriving it from the AWS Pricing API at query time would need an exporter,
    # a set of credentials inside the cluster and a network call on the evaluation path --
    # for a number that changes when someone runs `make gpu`.
    #
    # It counts the WHOLE platform, not just the GPU. A comparison against an external
    # API where the vendor absorbs the control plane and the tooling node is not a
    # comparison; excluding them would flatter self-hosting by about 20 US cents an hour.
    - name: platform.cost
      interval: 30s
      rules:
        - record: platform:cost_usd_per_hour
          # EKS control plane 0.10 + m7i.large tooling 0.1008 + g6.xlarge GPU 0.8048.
          # us-east-1 on-demand, September 2026.
          expr: vector(1.0056)

        # Output tokens per hour, floored so an idle platform reports no cost per token
        # rather than +Inf. Idle cost per token is undefined, not infinite, and an
        # infinity on a dashboard trains people to ignore the panel.
        - record: platform:output_tokens_per_hour
          expr: sum(vllm:output_tokens:rate1m) * 3600

        - record: platform:cost_usd_per_1k_output_tokens
          expr: |
            platform:cost_usd_per_hour
            /
            clamp_min(platform:output_tokens_per_hour / 1000, 1)

        # Break-even: how many output tokens per hour the platform must produce before it
        # costs less per token than an external API. Below this line self-hosting is more
        # expensive, and the honest justification becomes data sovereignty, not price.
        #
        # 0.60 USD per million output tokens is the reference point; change it to whichever
        # API the report actually compares against.
        - record: platform:breakeven_output_tokens_per_hour
          expr: platform:cost_usd_per_hour / 0.60 * 1e6
