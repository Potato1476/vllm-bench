# Two tiers, deliberately.
#
# vllm.slo fires when a user would notice. vllm.cause never pages: it records the engine
# state that explains a latency number. A full KV-Cache at high load is the system
# working as designed, not an incident -- treating it as one is how an alert channel
# stops being read.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-alerts
  namespace: monitoring
spec:
  groups:
    - name: vllm.slo
      rules:
        # Thresholds come from the SLO table and differ by class, so the alerts are split
        # rather than sharing one number. Class A streams and is judged on time-to-first-
        # token; class B returns a JSON blob in one piece and only end-to-end matters.
        #
        # Both conditions together on purpose: errors alone can be a bad client, and slow
        # alone can be a deliberate overload test. Together they mean the service is
        # failing the people using it.
        - alert: VllmSloBurnFastClassA
          expr: vllm:ttft_seconds:p95{model_class="a"} > 0.8
          for: 2m
          labels:
            severity: critical
            request_class: a
          annotations:
            summary: "Class A TTFT p95 is over the 800ms objective"

        - alert: VllmSloBurnFastClassB
          expr: vllm:e2e_seconds:p95{model_class="b"} > 1.5
          for: 2m
          labels:
            severity: critical
            request_class: b
          annotations:
            summary: "Class B end-to-end p95 is over the 1.5s objective"

        # The slow-burn pair. A latency objective missed for half an hour is a ticket,
        # not a page -- but it must not be invisible either.
        - alert: VllmSloBurnSlowClassA
          expr: avg_over_time(vllm:e2e_seconds:p95{model_class="a"}[30m]) > 3
          for: 30m
          labels:
            severity: warning
            request_class: a
          annotations:
            summary: "Class A end-to-end p95 has been over 3s for half an hour"

        - alert: VllmSloBurnSlowClassB
          expr: avg_over_time(vllm:e2e_seconds:p95{model_class="b"}[30m]) > 1.5
          for: 30m
          labels:
            severity: warning
            request_class: b
          annotations:
            summary: "Class B end-to-end p95 has been over 1.5s for half an hour"

        # Class A only: a stuttering stream is a distinct failure from a slow one, and
        # it points at a different fix (decode batch too large).
        - alert: VllmInterTokenLatencyClassA
          expr: vllm:tpot_seconds:p99{model_class="a"} > 0.06
          for: 5m
          labels:
            severity: warning
            request_class: a
          annotations:
            summary: "Class A inter-token latency p99 over the 60ms objective -- the stream stutters"

        # LiteLLM sees the failures that never reach vLLM: rejected keys, quota, routing,
        # timeouts and upstream 5xx. This is the caller-facing error SLI.
        - alert: LiteLlmHighErrorRate
          expr: litellm:error_ratio:rate2m > 0.02
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "LiteLLM error ratio is over 2% for {{ $labels.requested_model }}"

        - alert: LiteLlmHighEndToEndLatency
          expr: litellm:e2e_seconds:p95 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LiteLLM end-to-end p95 is over 3s for {{ $labels.requested_model }}"

        - alert: LiteLlmDeploymentDegraded
          expr: litellm_deployment_state > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "LiteLLM deployment {{ $labels.litellm_model_name }} is degraded"

        - alert: LiteLlmGatewayDown
          expr: |
            up{namespace="llm-serving", service="litellm-private"} == 0
            or absent(up{namespace="llm-serving", service="litellm-private"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus cannot scrape a LiteLLM gateway target"

        - alert: GuardrailServiceDown
          expr: |
            up{namespace="llm-serving", service="guardrail"} == 0
            or absent(up{namespace="llm-serving", service="guardrail"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus cannot scrape the guardrail serving hop"

        - alert: GuardrailInternalErrors
          expr: sum(rate(guardrail_requests_total{outcome="error",stage="internal"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "The guardrail service is returning internal errors"

        - alert: GuardrailHighErrorRate
          expr: guardrail:error_ratio:rate5m > 0.02
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Guardrail error ratio is over 2% for {{ $labels.model }}"

        - alert: GuardrailProcessingLatencyHigh
          expr: guardrail:processing_seconds:p95 > 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Guardrail-only processing p95 is over its 150ms budget"

        - alert: GuardrailUpstreamErrors
          expr: guardrail:upstream_error_ratio:rate5m > 0.02
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "More than 2% of guardrail calls to vLLM fail for {{ $labels.model }}"

        - alert: GuardrailBlockRateSpike
          expr: guardrail:block_ratio:rate5m > 0.20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Guardrail refusal ratio is over 20% for {{ $labels.model }}"

        - alert: GuardrailMetricsMissing
          expr: |
            up{namespace="llm-serving", service="guardrail"} == 1
            unless on() guardrail_build_info
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Guardrail target is reachable but its application metrics are missing"

        - alert: GuardrailSemanticCacheErrors
          expr: rate(guardrail_semantic_cache_requests_total{result="error"}[10m]) > 0
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "Semantic cache is failing; requests still run through retrieval and vLLM"

        - alert: LiteLlmPostgresErrors
          expr: litellm:postgres_error_ratio:rate5m > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 1% of LiteLLM PostgreSQL operations fail"

        - alert: LiteLlmPostgresLatencyHigh
          expr: litellm:postgres_seconds:p95 > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LiteLLM PostgreSQL operation p95 is over 250ms"

    - name: vllm.cause
      rules:
        - alert: KvCacheSaturated
          expr: vllm:kv_cache_usage_perc > 0.95
          for: 2m
          labels:
            severity: info
          annotations:
            summary: "KV-Cache nearly full -- context for a latency reading, not a fault"

        - alert: RequestsQueueing
          expr: vllm:num_requests_waiting > 0
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Requests are queueing -- offered load is past what the engine absorbs"

        - alert: GpuThermalThrottle
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "GPU over 85C -- sustained capacity may be below the short-run number"

    # Tracing fails quietly by design: the exporter in services/llm_pipeline/tracing.py
    # swallows connection errors so a collector outage can never slow a request. Quiet
    # failure means nobody finds out until they go looking for a trace that was never
    # stored -- usually in the middle of debugging something else. These two make the
    # absence visible instead.
    - name: tracing
      rules:
        - alert: TraceExportFailing
          expr: rate(guardrail_trace_spans_total{result="failed"}[10m]) > 0
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "Guardrail cannot reach Tempo -- traces are being lost, serving is unaffected"

        - alert: TraceSpansDropped
          # The queue is bounded and drops rather than blocks. Sustained drops mean the
          # exporter is not keeping up, so the traces that do arrive are a biased sample
          # -- the slow requests are the ones most likely to be missing.
          expr: rate(guardrail_trace_spans_total{result="dropped"}[10m]) > 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Trace queue is overflowing -- stored traces are no longer a fair sample"
