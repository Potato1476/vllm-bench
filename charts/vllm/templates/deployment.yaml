{{- $root := . -}}
{{- range $key := splitList " " (include "vllm.activeModels" .) }}
{{- $m := index $root.Values.models $key }}
{{- $gmu := include "vllm.gpuMemory" (dict "root" $root "key" $key) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $key }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: vllm-server
    model-class: {{ $key }}
  annotations:
    # Recorded here so `kubectl describe` answers "which configuration produced this
    # number" without cross-referencing anything.
    vllm-bench/mode: {{ $root.Values.mode }}
    vllm-bench/gpu-memory-utilization: {{ $gmu | quote }}
    # Which weights produced a number is part of the number. A throughput figure from
    # 4-bit AWQ is not comparable with one from FP16, and the difference is invisible in
    # the pod spec otherwise -- both mount /weights from an S3 prefix.
    vllm-bench/quantization: {{ $root.Values.quantization | quote }}
    vllm-bench/weights: {{ include "vllm.s3Prefix" (dict "root" $root "key" $key) | quote }}
spec:
  # One pod per GPU. Each pod requests nvidia.com/gpu: 1 and each g6.xlarge has exactly
  # one L4, so the scheduler spreads replicas across nodes without needing anti-affinity:
  # a second pod cannot land on a node whose only GPU is already claimed.
  #
  # Hard-coded to 1 until now, which meant a cluster scaled to four GPU nodes ran one
  # engine and left three cards idle -- the scale-out path existed in Terraform and had no
  # counterpart in the chart.
  replicas: {{ $m.replicas | default $root.Values.replicaCount | default 1 }}
  # One physical GPU. A rolling update would ask the scheduler to place a second pod
  # while the first still holds its GPU slot, so it would hang on Pending forever.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-server
      model-class: {{ $key }}
  template:
    metadata:
      labels:
        app: vllm-server
        model-class: {{ $key }}
    spec:
      serviceAccountName: {{ $root.Values.serviceAccount.name }}

      # The taint keeps everything else off the GPU node; the nodeSelector keeps vLLM off
      # every other node. Both halves are needed -- a toleration alone would still let
      # vLLM land on the tooling node and quietly measure a CPU-only run.
      # requiredDuringScheduling, not preferred, in both rules below. If there is not a
      # node for every pod the extra one stays Pending and says so, which is the honest
      # outcome: a preference would silently co-schedule and hand back numbers under a
      # name that claims otherwise.
      {{- if or (eq $root.Values.mode "split") (gt (int ($m.replicas | default $root.Values.replicaCount | default 1)) 1) }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- if gt (int ($m.replicas | default $root.Values.replicaCount | default 1)) 1 }}
            # NEVER two replicas of the SAME model on one node, in any mode.
            #
            # This rule was missing, and the reason it was missing is that nothing needed
            # it until replicaCount could exceed 1. It is not a redundancy with the
            # resource request: the GPU operator is configured with time-slicing
            # replicas: 2 (k8s/monitoring/gpu-operator-values.yaml), so each physical card
            # advertises nvidia.com/gpu: 2. Four replicas asking for one GPU each therefore
            # FIT on two cards, and the scheduler is free to pack them that way -- two
            # engines sharing one card's bandwidth while another card sits idle.
            #
            # That would not fail. It would return a per-card capacity number that is
            # roughly half the truth, with no error anywhere to say so. The four-L4 scale
            # test did land one pod per card (8060/8044/7977/7939 requests, 1.5% spread),
            # but nothing in the chart required it -- that run was luck, and a measurement
            # that depends on scheduler luck is not a measurement.
            - labelSelector:
                matchExpressions:
                  - key: model-class
                    operator: In
                    values: [{{ $key | quote }}]
              topologyKey: kubernetes.io/hostname
            {{- end }}
            {{- if eq $root.Values.mode "split" }}
            # One model CLASS per node, which is what split means.
            #
            # `shared` puts both engines on one L4 by splitting gpu-memory-utilization
            # 0.65/0.25. That was the only way to run two models on one card, and it costs
            # both of them: model A gets 14.6 GiB instead of 20.3, which measured out as
            # 5.19 GiB of KV cache instead of roughly 11 -- about 73 concurrent sequences
            # at this corpus's 1300-token prompts instead of ~154.
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["vllm-server"]
              topologyKey: kubernetes.io/hostname
            {{- end }}
      {{- end }}
      nodeSelector:
        {{- toYaml $root.Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $root.Values.tolerations | nindent 8 }}

      volumes:
        - name: weights
          # Instance-store NVMe, not an EBS PVC: free, faster, and it does not pin the
          # node to one AZ. Each model gets its own emptyDir so the two never collide.
          emptyDir:
            sizeLimit: {{ $m.weightsSizeLimit }}
        - name: shm
          # vLLM's workers coordinate over shared memory. The 64 MiB container default
          # fails as a hang during model load, not as an error message.
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi

      initContainers:
        - name: fetch-weights
          image: "{{ $root.Values.fetcher.repository }}:{{ $root.Values.fetcher.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -f /weights/.sync-complete ]; then
                echo "weights already cached, skipping sync"
                exit 0
              fi
              echo "syncing ${S3_MODEL_URI} -> /weights"
              aws s3 sync "${S3_MODEL_URI}" /weights/ --only-show-errors
              # A finished sync is not the same as a complete one. Fail here, with a clear
              # message, rather than inside vLLM as an unreadable load error.
              test -f /weights/config.json
              ls /weights/*.safetensors >/dev/null

              # --- verify against the signed manifest --------------------------------
              #
              # THIS IS THE CHECK THAT COUNTS. CI verifies the signature and the sizes on
              # S3, which proves the bucket was right AT THAT MOMENT. This proves the
              # bytes on this node's NVMe, right now, are the ones the signature covers --
              # on every pod start, including the ones hours later during a roll.
              #
              # It is also the only thing standing between a version being overwritten in
              # place and that overwrite being served. S3 does not forbid writing over a
              # key; nothing upstream of here would notice.
              #
              # Absent manifest = refuse. Weights with no manifest are weights nobody
              # signed, and defaulting to "serve it anyway" would make every check above
              # optional for anyone who can delete one file.
              if [ "${VERIFY_MANIFEST}" = "true" ]; then
                test -f /weights/manifest.json || {
                  echo "FATAL: /weights/manifest.json thieu -- trong so khong ky"; exit 1; }
                cd /weights
                # One line, not a heredoc: a heredoc's body has to sit at its own
                # indentation and that breaks the YAML block scalar this script lives in.
                # Both tools are in amazon/aws-cli:2.36.47 -- verified, python3 3.9 and
                # sha256sum from coreutils.
                #
                # sha256sum reads the manifest's own list, so an extra file on disk is not
                # checked here; CI rejects unlisted files, and nothing loads what the
                # manifest does not name.
                python3 -c 'import json; print("".join(f["sha256"]+"  "+f["path"]+chr(10) for f in json.load(open("/weights/manifest.json"))["files"]), end="")' > /tmp/sums
                sha256sum -c /tmp/sums --quiet || {
                  echo "FATAL: trong so tren dia khong khop manifest da ky"; exit 1; }
                echo "manifest verified: $(wc -l < /tmp/sums) file"
              else
                echo "VERIFY_MANIFEST=false -- bo qua kiem manifest (checkpoint cu)"
              fi

              touch /weights/.sync-complete
              echo "sync complete: $(du -sh /weights | cut -f1)"
              # Proves the emptyDir landed on NVMe and not the root EBS volume. Without
              # this the only symptom of a misconfigured node is "the sync got slower".
              df -h /weights | tail -1
          env:
{{- if $root.Values.artifactsBucket }}
            - name: S3_BUCKET
              value: {{ $root.Values.artifactsBucket | quote }}
{{- else }}
            # Tu ConfigMap trong cum, khong phai tu values. Ten bucket chua account ID,
            # va Argo CD dong bo tu mot repo cong khai -- nen gia tri nay khong the nam
            # trong git. `make cluster-config` tao ConfigMap nay tu terraform output.
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ $root.Values.clusterConfigMap }}
                  key: artifactsBucket
{{- end }}
            - name: S3_MODEL_URI
              value: "s3://$(S3_BUCKET)/{{ include "vllm.s3Prefix" (dict "root" $root "key" $key) }}/"
            # Default true. The escape hatch exists for the four checkpoints published by
            # hand before the contract existed, which carry no manifest; it is not a knob
            # to reach for when verification fails, because a failure there means the
            # bytes are not the signed ones.
            - name: VERIFY_MANIFEST
              value: {{ $root.Values.verifyManifest | default true | quote }}
          volumeMounts:
            - name: weights
              mountPath: /weights
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi

      containers:
        - name: vllm
          image: {{ include "vllm.engineImage" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - --model=/weights
            # Stable API name, so benchmark configs survive a checkpoint change.
            - --served-model-name={{ $m.servedName }}
            - --dtype={{ $m.dtype }}
            - --max-model-len={{ $m.maxModelLen }}
            # The value that divides the card. In shared mode the two models' shares must
            # sum below 1.0; the chart refuses to render otherwise.
            - --gpu-memory-utilization={{ $gmu }}
            - --max-num-seqs={{ $m.maxNumSeqs }}
            - --port=8000
            # No --disable-log-requests here. That flag was removed in vLLM v0.29; the
            # replacement is --enable-log-requests, and its default is already False, so
            # per-request logging is off without asking. Passing the old flag makes the
            # engine exit immediately with "unrecognized arguments", which reads as a
            # crash loop rather than as a flag that moved.
            {{- range $root.Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # Weights come from S3 and nowhere else. If the sync missed a file we want a
            # hard failure, not a silent download that makes one run's model subtly
            # different from the next one's.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          volumeMounts:
            - name: weights
              mountPath: /weights
              # The engine under test must not mutate the weights that define the
              # experiment.
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          {{- $res := include "vllm.resources" (dict "root" $root "key" $key) | fromYaml }}
          resources:
            requests:
              {{- toYaml $res.requests | nindent 14 }}
              nvidia.com/gpu: 1
            limits:
              # Deliberately no CPU limit. A limit would only risk CFS throttling, which
              # inflates exactly the TTFT numbers this platform exists to measure.
              {{- toYaml $res.limits | nindent 14 }}
              nvidia.com/gpu: 1
          startupProbe:
            # Up to 20 minutes: a cold NVMe syncs the weights from S3 and then loads them
            # onto the GPU. Too tight a threshold turns a slow start into a crash loop.
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 6
{{- end }}
