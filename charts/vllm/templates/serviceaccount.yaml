{{- include "vllm.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # How the pod gets AWS credentials without a static access key. The role is read-only
    # and scoped to the models/ prefix: the engine under test must not be able to write
    # anything, least of all the benchmark results that grade it.
    eks.amazonaws.com/role-arn: {{ .Values.roleArn }}
