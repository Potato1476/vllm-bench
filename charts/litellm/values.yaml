# Keep this in step with charts/vllm/values.yaml. In solo modes the gateway only
# advertises the model that is actually running, so /v1/models never lies to clients.
mode: shared

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  # Pinned: a moving tag makes rollback and benchmark lineage impossible to reproduce.
  tag: v1.90.2
  pullPolicy: IfNotPresent

existingSecret:
  name: litellm-secrets
  # Optional keys read through envFrom when present:
  #   DATABASE_URL - enables virtual keys, budgets and spend tracking in PostgreSQL
  #   LITELLM_SALT_KEY - encrypts credentials stored in PostgreSQL; never rotate it

models:
  a:
    publicName: qwen2.5-7b
    upstreamModel: qwen2.5-7b
    # LiteLLM must not bypass the pre/post-generation pipeline. The guardrail service
    # selects the matching vLLM backend after retrieval and input screening.
    apiBase: http://guardrail.llm-serving.svc.cluster.local:8080/v1
  b:
    publicName: qwen2.5-1.5b
    upstreamModel: qwen2.5-1.5b
    apiBase: http://guardrail.llm-serving.svc.cluster.local:8080/v1

router:
  strategy: simple-shuffle
  retries: 1
  timeoutSeconds: 300

service:
  # Lab traffic arrives through ingress-nginx. ClusterIP also avoids colliding with the
  # controller's HTTPS NodePort 30443. A production values file may switch this service
  # to NodePort when an internal NLB targets LiteLLM directly.
  type: ClusterIP
  port: 4000
  nodePort: 30443
  externalTrafficPolicy: Cluster

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    # 2Gi, and the 1Gi it replaces is a regression that came back because the first fix
    # never made it into git.
    #
    # LiteLLM v1.90.2 is OOMKilled at 1Gi before it finishes starting: exit 137 within six
    # seconds, the startup probe never gets a connection, and the pod sits in
    # CrashLoopBackOff looking like a configuration fault rather than a memory one. The
    # proxy loads its router, the Prometheus callback and the OTEL exporter before it
    # binds the port, and that peak is above a gigabyte on its own.
    #
    # This was diagnosed once before and fixed with a --set against a running cluster.
    # That cluster is destroyed every evening, so the fix died with it and the same six
    # seconds were spent diagnosing it again. A change that only exists in a live cluster
    # is not a change; it is a note nobody wrote down.
    memory: 2Gi

nodeSelector:
  workload: tooling

tolerations: []

podDisruptionBudget:
  # Kept for the future Redis-backed HA profile. This phase deliberately runs one pod.
  enabled: false
  minAvailable: 1

topologySpreadConstraints: []

tracing:
  # Sends gateway spans to Tempo, and starts the trace that the guardrail service and
  # vLLM then continue -- so one trace covers all three hops instead of three unrelated
  # ones. Safe to leave on when Tempo is absent: the exporter fails in the background.
  #
  # Requires litellm_settings.turn_off_message_logging, which the ConfigMap sets and
  # explains. Without it the OTEL callback writes prompts into spans.
  enabled: true
  endpoint: http://tempo.monitoring.svc.cluster.local:4318
