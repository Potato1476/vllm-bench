{{- include "litellm.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: litellm
data:
  config.yaml: |
    model_list:
      {{- range $key := splitList " " (include "litellm.activeModels" .) }}
      {{- $m := index $.Values.models $key }}
      - model_name: {{ $m.publicName | quote }}
        litellm_params:
          # vLLM exposes an OpenAI-compatible API and does not require an upstream key.
          model: {{ printf "openai/%s" $m.upstreamModel | quote }}
          api_base: {{ $m.apiBase | quote }}
          api_key: "none"
      {{- end }}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # THE LINE THAT MAKES PER-AGENT ATTRIBUTION WORK AT ALL.
      #
      # end_user is the dimension the per-agent dashboard groups by, and nothing else
      # populates it. Read from litellm_pre_call_utils.py in v1.90.2:
      #
      #     user = get_user_from_headers(_headers, general_settings)
      #     if user is not None:
      #         if user_api_key_dict.end_user_id is None:
      #             user_api_key_dict.end_user_id = user
      #
      # and get_user_from_headers returns None immediately unless user_header_name is
      # set here. So the label comes from an HTTP HEADER, not from the OpenAI `user`
      # field in the body -- sending {"user": "moc-analytics"} labels nothing, which is
      # what measuring it on this deployment showed: end_user="None" on every series.
      #
      # A virtual key is still required (it is what makes the request attributable at
      # all), but it is not sufficient. Both halves are needed, and they fail
      # independently and silently.
      user_header_name: X-Agent-Id
    litellm_settings:
      drop_params: true
      # Load-bearing for tracing, not only for logs. LiteLLM's OTEL callback otherwise
      # stamps the raw request onto every span -- opentelemetry.py sets
      # attrs["gen_ai.prompt"] = msg["content"] -- which would put the text that pipeline
      # stage 2 redacts into the trace backend verbatim. This flag is what forces its
      # NO_CONTENT path. Never enable "otel" below without it.
      turn_off_message_logging: true
      {{- if .Values.tracing.enabled }}
      callbacks: ["prometheus", "otel"]
      {{- else }}
      callbacks: ["prometheus"]
      {{- end }}
      # Aurora is on the request path for virtual keys, budgets and spend accounting.
      # This callback exposes its latency and failure counters without logging content.
      service_callback: ["prometheus_system"]
      # Per-agent acceptance rules use the end-user identity attached to virtual keys.
      # Bound it tightly: the pilot needs >=7 agents, not an unbounded caller dimension.
      enable_end_user_cost_tracking_prometheus_only: true
      prometheus_end_user_metrics_max_series_per_metric: 100
      prometheus_end_user_metrics_ttl_seconds: 3600
      # Keep only operational dimensions. Never persist client_ip, user_agent or the raw
      # OpenAI user field as Prometheus labels.
      prometheus_metrics_config:
        - group: proxy_total
          metrics: ["litellm_proxy_total_requests_metric"]
          include_labels: ["end_user", "requested_model", "team", "status_code", "route"]
        - group: proxy_failures
          metrics: ["litellm_proxy_failed_requests_metric"]
          include_labels: ["end_user", "requested_model", "team", "exception_status", "exception_class", "route"]
        - group: request_latency
          metrics:
            - "litellm_request_total_latency_metric"
            - "litellm_llm_api_latency_metric"
            - "litellm_llm_api_time_to_first_token_metric"
            - "litellm_request_queue_time_seconds"
          include_labels: ["end_user", "requested_model", "model", "team"]
        - group: overhead
          metrics: ["litellm_overhead_latency_metric"]
          include_labels: ["model_group", "litellm_model_name", "api_provider"]
        - group: deployment_requests
          metrics:
            - "litellm_deployment_total_requests"
            - "litellm_deployment_success_responses"
          include_labels: ["requested_model", "litellm_model_name", "team"]
        - group: deployment_failures
          metrics: ["litellm_deployment_failure_responses"]
          include_labels: ["requested_model", "litellm_model_name", "team", "exception_status", "exception_class"]
        - group: deployment_latency
          metrics: ["litellm_deployment_latency_per_output_token"]
          include_labels: ["litellm_model_name", "team"]
        - group: deployment_state
          metrics: ["litellm_deployment_state"]
          include_labels: ["litellm_model_name", "api_provider"]
        - group: tokens
          metrics:
            - "litellm_input_tokens_metric"
            - "litellm_output_tokens_metric"
            - "litellm_total_tokens_metric"
          include_labels: ["end_user", "requested_model", "model", "team"]
        - group: spend
          metrics: ["litellm_spend_metric"]
          include_labels: ["model", "team"]
      num_retries: {{ .Values.router.retries }}
      request_timeout: {{ .Values.router.timeoutSeconds }}
    router_settings:
      routing_strategy: {{ .Values.router.strategy | quote }}
      num_retries: {{ .Values.router.retries }}
      timeout: {{ .Values.router.timeoutSeconds }}
