# K8S-014: guardrail truoc day chay bang ServiceAccount `default` cua namespace.
#
# `default` la danh tinh moi pod khong khai gi deu nhan, nen mot RoleBinding gan cho no --
# boi bat ky chart nao trong cung namespace -- se lang le cap quyen do cho guardrail. Mot
# ServiceAccount rieng khong mang quyen gi lam cho dieu do khong xay ra duoc.
#
# Khong co annotation IRSA: guardrail khong goi AWS. Token cung khong duoc mount
# (automountServiceAccountToken: false trong Deployment).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrail
  namespace: {{ .Release.Namespace }}
  labels:
    app: guardrail
    app.kubernetes.io/name: guardrail
automountServiceAccountToken: false
