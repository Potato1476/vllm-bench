{{- include "guardrail.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail
  namespace: {{ .Release.Namespace }}
  labels:
    app: guardrail
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: guardrail
  template:
    metadata:
      labels:
        app: guardrail
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: guardrail
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODEL_ROUTES_JSON
              value: {{ toJson .Values.models | quote }}
            - name: DEFAULT_ACCESS_LEVEL
              value: {{ .Values.defaultAccessLevel | quote }}
            - name: UPSTREAM_TIMEOUT_SECONDS
              value: {{ .Values.upstreamTimeoutSeconds | quote }}
            - name: GUARDRAIL_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: POLICY_VERSION
              value: {{ .Values.observability.policyVersion | quote }}
            - name: CORPUS_VERSION
              value: {{ .Values.observability.corpusVersion | quote }}
            {{- if .Values.dense.enabled }}
            - name: DENSE_INDEX_PATH
              value: {{ .Values.dense.indexPath | quote }}
            - name: DENSE_ENDPOINT
              value: {{ .Values.dense.endpoint | quote }}
            - name: DENSE_TIMEOUT_SECONDS
              value: {{ .Values.dense.timeoutSeconds | quote }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            # No endpoint means no tracing: the tracer starts no thread and every span
            # call becomes a no-op, so the offline harnesses that import this module
            # need no configuration to avoid it.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | quote }}
            - name: OTEL_SERVICE_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.tracing.sampleRatio | quote }}
            # Which pod and node served a request is the first question asked of a slow
            # trace, and the only place the answer can come from is the pod itself.
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
