{{- include "guardrail.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail
  namespace: {{ .Release.Namespace }}
  labels:
    app: guardrail
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: guardrail
  template:
    metadata:
      labels:
        app: guardrail
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: guardrail
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODEL_ROUTES_JSON
              value: {{ toJson .Values.models | quote }}
            - name: DEFAULT_ACCESS_LEVEL
              value: {{ .Values.defaultAccessLevel | quote }}
            - name: UPSTREAM_TIMEOUT_SECONDS
              value: {{ .Values.upstreamTimeoutSeconds | quote }}
            - name: GUARDRAIL_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: POLICY_VERSION
              value: {{ .Values.observability.policyVersion | quote }}
            - name: CORPUS_VERSION
              value: {{ .Values.observability.corpusVersion | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
