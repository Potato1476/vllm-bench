replicaCount: 1

image:
  # Supplied by `make guardrail-up` from terraform/core output.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8080

models:
  qwen2.5-7b: http://vllm-a.inference.svc.cluster.local:8000/v1
  qwen2.5-1.5b: http://vllm-b.inference.svc.cluster.local:8000/v1

defaultAccessLevel: internal-demo
upstreamTimeoutSeconds: 300

observability:
  policyVersion: builtin-v1
  corpusVersion: bundled

# Hybrid retrieval. Off unless an embeddings service exists to embed the query.
#
# Measured on the 144 gold queries: lexical 0.570 nDCG@10, dense 0.606, fused 0.650 -- and
# lexical misses 4 queries completely while dense misses 20. Fusion keeps lexical's
# exact-identifier floor while improving paraphrased and reasoning queries.
#
# indexPath points inside the image, where the Dockerfile copies data/index/ if it was
# built. endpoint is a text-embeddings-inference service -- see k8s/embeddings/tei.yaml.
# With either missing the service starts normally and retrieves lexically.
dense:
  enabled: false
  indexPath: /app/data/index/dense-vi
  endpoint: http://tei.llm-serving.svc.cluster.local/
  timeoutSeconds: 2.0

# Safe response cache. Redis is a sidecar reached only through a shared Unix socket: it
# has no Service and no TCP listener. The cache remains exact-only when embeddingEndpoint
# is empty; point it at TEI to enable semantic similarity between different phrasings.
# Content audit log: one JSON line per request carrying the question and the answer.
#
# OFF by default, and that default is load-bearing rather than cautious. tracing.py and
# LiteLLM's turn_off_message_logging both refuse to record content because pipeline stage
# 2 exists to redact it; see the _audit docstring in app.py for when enabling this is
# defensible (synthetic lab corpus) and when it is not (any real MOC question).
#
# It lives here rather than being flipped with `kubectl set env`, because an imperative
# edit takes ownership of the field away from Helm and the next `make guardrail-up` then
# fails with a field-manager conflict -- which is exactly how this value got added.
auditLog: false

# Models whose output format is constrained at decode time so they must cite a document
# that is in context. See _force_citation in app.py for the measurement.
forceCitationModels: "qwen2.5-1.5b"

# Model names ending in this suffix are served WITHOUT retrieval and WITHOUT the citation
# requirement, keeping injection screening and PII screening both ways. See the
# PLAIN_PROFILE_SUFFIX block in services/llm_pipeline/app.py for why the profile rides on
# the model name instead of a request field. Must match plainProfile.suffix in
# charts/litellm; set to "" to refuse the profile entirely.
plainProfileSuffix: "-plain"

# Prepended to every answer the platform serves, because the indexed corpus is synthetic:
# 720 of its 798 records are generated daily operations figures for real GreenSM cities,
# and grounding cannot tell a true document from a plausible one. See the ANSWER_NOTICE
# block in services/llm_pipeline/app.py for why this is not a system-prompt instruction.
#
# LEAVE `enabled` ON. The corpus is simulated for the life of this project -- the team has
# no access to internal company documents -- so this is a permanent property of the
# deployment, not a stage it grows out of. The flag exists for a deployment that indexes
# real documents; that deployment is not this one.
#
# `text` empty keeps app.py's built-in Vietnamese default. Set it to override the wording.
answerNotice:
  enabled: true
  text: ""

semanticCache:
  enabled: true
  ttlSeconds: 3600
  similarityThreshold: 0.96
  maxCandidates: 256
  embeddingEndpoint: ""
  embeddingTimeoutSeconds: 0.3
  redis:
    mode: sidecar
    existingSecret:
      name: ""
      key: REDIS_URL
    image: redis:7.4.5-alpine
    maxMemory: 192mb
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

tracing:
  # On by default. The exporter runs on a background thread and drops spans rather than
  # blocking a request, so a Tempo that is absent or restarting costs serving nothing --
  # which is what makes leaving this on safe even when `make tracing-up` has not been run.
  enabled: true
  endpoint: http://tempo.monitoring.svc.cluster.local:4318
  serviceName: guardrail
  # Sample everything. This lab serves a few hundred requests per benchmark run, and the
  # reason to open a trace is almost always "the request I just sent" -- a sampler that
  # threw most of them away would make the tool useless at exactly the moment it is
  # wanted. Lower it if a load test ever makes the span volume matter.
  sampleRatio: 1.0

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

nodeSelector:
  workload: tooling

tolerations: []

topologySpreadConstraints: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
